{% extends "base.html" %}
{% block title %}Sign Up - USB Forensic Dashboard{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-lg p-8 w-full border border-gray-100">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-1">Create an Account</h1>
        <p class="text-gray-500 text-sm">Join the USB Forensic Dashboard</p>
    </div>

    <form method="POST" action="{{ url_for('auth.signup') }}" class="space-y-4" id="signupForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="username">Username</label>
            <input type="text" id="username" name="username" required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-shadow text-gray-900">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
            <input type="email" id="email" name="email" required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-shadow text-gray-900">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
            <input type="password" id="password" name="password" required onkeyup="checkStrength()"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-shadow text-gray-900">
            
            <div class="mt-2 flex gap-1 h-1.5 w-full bg-gray-200 rounded-full overflow-hidden">
                <div id="str-1" class="h-full w-1/3 transition-colors"></div>
                <div id="str-2" class="h-full w-1/3 transition-colors"></div>
                <div id="str-3" class="h-full w-1/3 transition-colors"></div>
            </div>
            <p id="str-text" class="text-xs text-gray-500 mt-1">Requires 8+ chars, 1 number, 1 uppercase</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-shadow text-gray-900">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-brand hover:bg-brand-hover text-white font-semibold py-2.5 rounded-lg transition-colors mt-2">
            Create Account
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
        Already have an account? <a href="{{ url_for('auth.login') }}" class="text-brand hover:text-brand-hover font-medium">Sign In</a>
    </p>
</div>

<script>
    function checkStrength() {
        const pwd = document.getElementById('password').value;
        const str1 = document.getElementById('str-1');
        const str2 = document.getElementById('str-2');
        const str3 = document.getElementById('str-3');
        const strText = document.getElementById('str-text');
        
        let strength = 0;
        if (pwd.length >= 8) strength += 1;
        if (/[A-Z]/.test(pwd)) strength += 1;
        if (/[0-9]/.test(pwd)) strength += 1;
        if (/[^A-Za-z0-9]/.test(pwd)) strength += 1; // Bonus
        
        // Reset colors
        [str1, str2, str3].forEach(el => { el.className = 'h-full w-1/3 transition-colors bg-gray-200'; });
        
        if (pwd.length === 0) {
            strText.innerText = "Requires 8+ chars, 1 number, 1 uppercase";
        } else if (strength <= 1) {
            str1.classList.replace('bg-gray-200', 'bg-red-500');
            strText.innerText = "Weak";
            strText.className = "text-xs mt-1 text-red-500";
        } else if (strength === 2 || strength === 3) {
            str1.classList.replace('bg-gray-200', 'bg-yellow-500');
            str2.classList.replace('bg-gray-200', 'bg-yellow-500');
            strText.innerText = "Medium";
            strText.className = "text-xs mt-1 text-yellow-600";
        } else {
            str1.classList.replace('bg-gray-200', 'bg-green-500');
            str2.classList.replace('bg-gray-200', 'bg-green-500');
            str3.classList.replace('bg-gray-200', 'bg-green-500');
            strText.innerText = "Strong";
            strText.className = "text-xs mt-1 text-green-600";
        }
    }

    document.getElementById('signupForm').addEventListener('submit', function(e) {
        const pwd = document.getElementById('password').value;
        const cpwd = document.getElementById('confirm_password').value;
        if (pwd !== cpwd) {
            e.preventDefault();
            alert("Passwords do not match!");
        }
    });
</script>
{% endblock %}
