{% extends "base.html" %}
{% block title %}Verify Code - NexTrace{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-lg p-8 w-full border border-gray-100 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand/10 text-brand mb-4">
        <i data-feather="mail"></i>
    </div>
    
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Check Your Email</h1>
    <p class="text-gray-500 text-sm mb-8">We sent a 6-digit verification code to <span class="font-medium text-gray-700">{{ session.get('reset_email') }}</span>. It will expire in 10 minutes.</p>

    <form method="POST" action="{{ url_for('auth.verify_otp') }}" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div>
            <label class="sr-only" for="otp_code">Verification Code</label>
            <input type="text" id="otp_code" name="otp_code" required maxlength="6" pattern="\d{6}"
                class="w-full text-center tracking-widest text-2xl px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-shadow text-gray-900"
                placeholder="------" autofocus>
        </div>

        <button type="submit" class="w-full bg-brand hover:bg-brand-hover text-white font-semibold py-2.5 rounded-lg transition-colors">
            Verify Code
        </button>
    </form>
    
    <div class="mt-6">
        <a href="{{ url_for('auth.forgot_password') }}" class="text-sm text-gray-500 hover:text-brand transition-colors">
            Didn't receive a code? Try again
        </a>
    </div>
</div>
{% endblock %}
