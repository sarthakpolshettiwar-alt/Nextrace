{% extends "base.html" %}
{% block title %}Forgot Password - NexTrace{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-lg p-8 w-full border border-gray-100">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand/10 text-brand mb-4">
            <i data-feather="key"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Forgot Password?</h1>
        <p class="text-gray-500 text-sm">Enter your registered email address and we'll send you a 6-digit verification code to reset your password.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
            <input type="email" id="email" name="email" required 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-shadow text-gray-900"
                placeholder="you@example.com">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-brand hover:bg-brand-hover text-white font-semibold py-2.5 rounded-lg transition-colors flex justify-center items-center">
            <span id="btn-text">Send Verification Code</span>
            <svg id="loading-spinner" class="animate-spin ml-2 h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </form>
    
    <div class="mt-6 text-center">
        <a href="{{ url_for('auth.login') }}" class="text-sm text-gray-500 hover:text-brand transition-colors inline-flex items-center">
            <i data-feather="arrow-left" class="w-4 h-4 mr-1"></i> Back to Login
        </a>
    </div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function() {
        document.getElementById('submit-btn').disabled = true;
        document.getElementById('btn-text').innerText = 'Sending...';
        document.getElementById('loading-spinner').classList.remove('hidden');
    });
</script>
{% endblock %}
